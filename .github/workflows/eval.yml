name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 pin: tsx runtime + node:test glob-free explicit file lists
          # (ralplan consensus DR — engines allows >=20, CI pins 22 LTS)
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Extractor eval regression gate (seed set vs baseline.json)
        run: pnpm eval -- --check
